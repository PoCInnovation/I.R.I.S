[project]
name = "i-r-i-s"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "face-recognition>=1.3.0",
    "instaloader>=4.13",
    "onnxruntime>=1.26.0",
    "openai>=1.40.0",
    "opencv-python>=4.13.0.92",
    "playwright>=1.45.0",
    "playwright-stealth>=2.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.1",
    "ultralytics>=8.4.48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
